name: Update latest videos

# Refreshes videos.json with the newest uploads from the YouTube channel once a day.
# Netlify redeploys automatically whenever the file changes.
# To run it right now: Actions tab, "Update latest videos", Run workflow.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the latest videos
        env:
          HANDLE: run1000hills
          # If the lookup ever fails, paste the channel ID (starts with UC) between the quotes.
          CHANNEL_ID: ""
        run: |
          python3 - <<'PY'
          import json, os, re, sys, time, urllib.request
          import xml.etree.ElementTree as ET

          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"

          def get(url, tries=3):
              last = None
              for i in range(tries):
                  try:
                      req = urllib.request.Request(url, headers={
                          "User-Agent": UA,
                          "Accept-Language": "en-US,en;q=0.9",
                          "Cookie": "CONSENT=YES+1; SOCS=CAI",
                      })
                      with urllib.request.urlopen(req, timeout=30) as r:
                          return r.read().decode("utf-8", "replace")
                  except Exception as e:
                      last = e
                      time.sleep(3 * (i + 1))
              raise last

          cid = os.environ.get("CHANNEL_ID", "").strip()
          if not cid:
              page = get("https://www.youtube.com/@" + os.environ["HANDLE"])
              for pat in (r"channel_id=(UC[\w-]{22})", r'"externalId":"(UC[\w-]{22})"', r"youtube\.com/channel/(UC[\w-]{22})"):
                  m = re.search(pat, page)
                  if m:
                      cid = m.group(1)
                      break
          if not cid:
              print("Could not find the channel ID. Set CHANNEL_ID in the workflow file.")
              sys.exit(1)
          print("Channel ID:", cid)

          root = ET.fromstring(get("https://www.youtube.com/feeds/videos.xml?channel_id=" + cid))
          ns = {"a": "http://www.w3.org/2005/Atom", "yt": "http://www.youtube.com/xml/schemas/2015"}
          items = []
          for e in root.findall("a:entry", ns)[:10]:
              vid = e.findtext("yt:videoId", default="", namespaces=ns)
              if re.fullmatch(r"[\w-]{11}", vid):
                  items.append({
                      "id": vid,
                      "title": e.findtext("a:title", default="", namespaces=ns),
                      "published": e.findtext("a:published", default="", namespaces=ns),
                  })
          if not items:
              print("No videos found in the feed.")
              sys.exit(1)

          with open("videos.json", "w", encoding="utf-8") as f:
              json.dump(items, f, ensure_ascii=False, indent=2)
              f.write("\n")
          print("Wrote", len(items), "videos")
          PY

      - name: Save videos.json if it changed
        run: |
          if [ -n "$(git status --porcelain videos.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add videos.json
            git commit -m "Update latest videos"
            git push
          else
            echo "No new videos."
          fi
