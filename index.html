<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: one fixed screen. A live wireframe atlas sits behind a left-aligned column
     (name, coordinates, role, links, about). A small wireframe globe sits bottom right.
     Hovering a link flies both to that place. Selecting a link dives in, then hands off. */
  :root {
    --bg: #07080a;
    --bg-rgb: 7 8 10;
    --fg: #ecebe6;
    --dim: #868b91;
    --line: #23272c;
    --signal: #8fb7c9;
    --display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--mono);
    font-size: 14px;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #atlas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .veil {
    position: fixed; inset: 0; pointer-events: none;
    background:
      linear-gradient(90deg, rgb(var(--bg-rgb) / .94) 0%, rgb(var(--bg-rgb) / .6) 48%, rgb(var(--bg-rgb) / .12) 100%),
      linear-gradient(0deg, rgb(var(--bg-rgb) / .7) 0%, rgb(var(--bg-rgb) / 0) 30%);
  }

  #globeWrap {
    position: fixed; z-index: 0; display: grid; justify-items: end; gap: 8px;
    right: max(16px, env(safe-area-inset-right, 0px));
    bottom: calc(clamp(20px, 4.5vh, 44px) + env(safe-area-inset-bottom, 0px));
    pointer-events: none;
  }
  #globe { width: clamp(112px, 26vmin, 220px); height: clamp(112px, 26vmin, 220px); display: block; }
  .legend { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); display: flex; gap: 14px; }

  .stage {
    position: relative; z-index: 1; height: 100%;
    display: grid; grid-template-rows: auto 1fr auto;
    padding-block: clamp(20px, 4.5vh, 44px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    transition: opacity .5s ease, transform .9s cubic-bezier(.6,0,.2,1);
    pointer-events: none;
  }
  .stage > * { min-width: 0; }
  .stage a, .stage button, .stage #about { pointer-events: auto; }

function fmt(lat, lon) {
  return Math.abs(lat).toFixed(2) + "° " + (lat >= 0 ? "N" : "S") + " · " +

}
function wrap180(d) { return ((d + 540) % 360 + 360) % 360 - 180; }

/* ---------- Bio popup (hover on desktop, tap on phones) ---------- */
const who = $("who"), bio = $("bio");
$("bioText").textContent = BIO;
const canHoverBio = window.matchMedia("(hover: hover)").matches;
function showBio() {
  const r = who.getBoundingClientRect(), bw = bio.offsetWidth, bh = bio.offsetHeight;
  let x = r.right + 24, y = r.top + 8;
  if (x + bw > window.innerWidth - 16) { x = 16; y = who.closest("header").getBoundingClientRect().bottom + 12; }
  y = Math.max(12, Math.min(y, window.innerHeight - bh - 12));
  bio.style.left = Math.round(x) + "px"; bio.style.top = Math.round(y) + "px";
  bio.classList.add("on"); who.setAttribute("aria-expanded", "true");
}
function hideBio() { bio.classList.remove("on"); who.setAttribute("aria-expanded", "false"); }
if (canHoverBio) {
  who.addEventListener("mouseenter", showBio); who.addEventListener("mouseleave", hideBio);
  who.addEventListener("focus", showBio); who.addEventListener("blur", hideBio);
} else {
  who.addEventListener("click", e => { e.stopPropagation(); bio.classList.contains("on") ? hideBio() : showBio(); });
  document.addEventListener("click", () => hideBio());
}
window.addEventListener("keydown", e => { if (e.key === "Escape") hideBio(); });

/* ---------- Links ---------- */
const nav = $("links");
LINKS.forEach((l, i) => {
  const a = document.createElement("a");
  a.className = "node";
  a.textContent = l.label;
  a.href = l.url || "#";
  a.dataset.i = i;
  if (!l.url) a.dataset.soon = "1";
  nav.appendChild(a);
});

/* ---------- Audio note ---------- */
if (NOTE.src) {
  const nb = $("noteBtn"), audio = new Audio(NOTE.src);
  const idle = NOTE.label + " · " + NOTE.length;
  nb.hidden = false; nb.textContent = "▶ " + idle;
  nb.addEventListener("click", () => {
    if (audio.paused) { audio.play().catch(() => {}); nb.textContent = "■ " + idle; }

  audio.addEventListener("ended", () => { nb.textContent = "▶ " + idle; });
}

  }
  gctx.globalAlpha = 1;
}
requestAnimationFrame(frame);

/* ---------- Hover: fly the atlas and globe ---------- */
const coordsEl = $("coords");
const IDLE_SPAN = 40, NEAR_SPAN = 14;
const tip = $("tip");
const canHover = window.matchMedia("(hover: hover)").matches;
function showTip(a, l) {
  if (!canHover || !l.desc) return;
  tip.textContent = l.desc;
  const r = a.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
  let x = r.right + 38, y = r.top + r.height / 2 - th / 2;
  if (x + tw > window.innerWidth - 16) { x = Math.max(16, r.left); y = r.bottom + 8; }
  y = Math.max(12, Math.min(y, window.innerHeight - th - 12));
  tip.style.left = Math.round(x) + "px"; tip.style.top = Math.round(y) + "px";
  tip.classList.add("on");
}
function hideTip() { tip.classList.remove("on"); }
function setHome() { hideTip(); coordsEl.textContent = fmt(HOME.lat, HOME.lon); fly(HOME.lat, HOME.lon, IDLE_SPAN); }
function setPlace(l, a) { hideBio(); coordsEl.textContent = l.place + " · " + fmt(l.lat, l.lon); fly(l.lat, l.lon, NEAR_SPAN); showTip(a, l); if (l.feed) loadFeed(); }
setHome();
nav.addEventListener("mouseover", e => { const a = e.target.closest(".node"); if (a) setPlace(LINKS[a.dataset.i], a); });
nav.addEventListener("focusin",   e => { const a = e.target.closest(".node"); if (a) setPlace(LINKS[a.dataset.i], a); });
nav.addEventListener("mouseleave", setHome);
nav.addEventListener("focusout", e => { if (!nav.contains(e.relatedTarget)) setHome(); });

/* ---------- Run 1000 Hills carousel ---------- */
const feed = { slides: [], i: 0, timer: null, playing: false, hover: false, gen: 0, ready: null };
function loadFeed() {
  if (feed.ready) return feed.ready;
  feed.ready = fetch(FEED.videosUrl, { cache: "no-cache" })
    .then(r => r.ok ? r.json() : [])
    .catch(() => [])
    .then(list => {
      const yt = (Array.isArray(list) ? list : []).filter(v => v && /^[\w-]{11}$/.test(v.id)).slice(0, FEED.maxYouTube);
      const ig = (FEED.instagram || []).filter(x => x && x.url);
      const out = [];
      for (let k = 0; k < Math.max(yt.length, ig.length); k++) {
        if (yt[k]) out.push({ type: "yt", id: yt[k].id, title: yt[k].title || "" });
        if (ig[k]) out.push({ type: "ig", url: ig[k].url, caption: ig[k].caption || "", thumb: ig[k].thumb || "" });
      }
      feed.slides = out;
      return out;
    });
  return feed.ready;
}
function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text) n.textContent = text; return n; }
function renderSlide() {
  const frame = $("frame"), n = feed.slides.length, s = feed.slides[feed.i];
  frame.textContent = ""; feed.playing = false;
  $("gFeed").querySelector(".reel-bar").classList.toggle("single", n < 2);
  if (!s) {
    frame.appendChild(el("div", "slide empty", "Watch the latest on YouTube or Instagram with the buttons below."));
    $("reelTitle").textContent = ""; $("reelCount").textContent = "";
    return;
  }
  if (s.type === "yt") {
    const b = el("button", "slide"); b.type = "button";
    b.style.backgroundImage = 'url("https://i.ytimg.com/vi/' + s.id + '/hqdefault.jpg")';
    b.setAttribute("aria-label", "Play " + (s.title || "video"));
    b.appendChild(el("span", "play", "▶")).setAttribute("aria-hidden", "true");
    b.addEventListener("click", () => playYT(s));
    frame.appendChild(b);
  } else {
    const a = el("a", "slide"); a.href = s.url; a.target = "_blank"; a.rel = "noopener";
    if (s.thumb) a.style.backgroundImage = 'url("' + String(s.thumb).replace(/"/g, "%22") + '")';
    a.appendChild(el("span", "badge", "Instagram · Reel"));
    if (s.caption) a.appendChild(el("span", "cap", s.caption));
    a.appendChild(el("span", "cta", "Watch on Instagram →"));
    frame.appendChild(a);
  }
  $("reelTitle").textContent = s.type === "yt" ? s.title : (s.caption || "Reel on Instagram");
  $("reelCount").textContent = (feed.i + 1) + " / " + n;
}
function playYT(s) {
  const f = document.createElement("iframe");
  f.src = "https://www.youtube-nocookie.com/embed/" + s.id + "?autoplay=1&mute=1&playsinline=1&rel=0";
  f.title = s.title || "Video";
  f.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
  f.allowFullscreen = true;
  $("frame").textContent = ""; $("frame").appendChild(f);
  feed.playing = true;
}
function goSlide(d) {
  const n = feed.slides.length; if (n < 2) return;
  feed.i = (feed.i + d + n) % n; renderSlide(); startTimer();
}
function startTimer() {
  clearInterval(feed.timer); feed.timer = null;
  if (reduce || feed.slides.length < 2) return;
  feed.timer = setInterval(() => { if (!feed.playing && !feed.hover && !document.hidden) goSlide(1); }, FEED.advanceMs);
}
function startFeed() {
  const g = ++feed.gen;
  $("frame").textContent = ""; $("reelTitle").textContent = "Loading the latest…"; $("reelCount").textContent = "";
  loadFeed().then(() => { if (feed.gen !== g || gate.hidden) return; feed.i = 0; renderSlide(); startTimer(); });
}
function stopFeed() { feed.gen++; clearInterval(feed.timer); feed.timer = null; feed.playing = false; $("frame").textContent = ""; }
$("reelPrev").addEventListener("click", () => goSlide(-1));
$("reelNext").addEventListener("click", () => goSlide(1));
$("gFeed").addEventListener("mouseenter", () => { feed.hover = true; });
$("gFeed").addEventListener("mouseleave", () => { feed.hover = false; });
let swipeX = null;
$("frame").addEventListener("touchstart", e => { swipeX = e.touches[0].clientX; }, { passive: true });
$("frame").addEventListener("touchend", e => {
  if (swipeX === null || feed.playing) return;
  const dx = e.changedTouches[0].clientX - swipeX; swipeX = null;
  if (Math.abs(dx) > 45) goSlide(dx < 0 ? 1 : -1);
});
window.addEventListener("keydown", e => {
  if (gate.hidden || $("gFeed").hidden) return;
  if (e.key === "ArrowRight") goSlide(1); else if (e.key === "ArrowLeft") goSlide(-1);
});

/* ---------- Thesis viewer (Issuu embeds) ---------- */
let viewCfg = null, viewI = 0;
function selectDoc(i) {
  if (!viewCfg) return;
  const n = viewCfg.docs.length; viewI = (i + n) % n;
  const doc = viewCfg.docs[viewI];
  [...$("vTabs").children].forEach((b, k) => { b.setAttribute("aria-selected", String(k === viewI)); b.tabIndex = k === viewI ? 0 : -1; });
  const f = document.createElement("iframe");
  f.src = "https://e.issuu.com/embed.html?d=" + encodeURIComponent(doc.d) + "&u=" + encodeURIComponent(viewCfg.user);
  f.title = "Thesis: " + doc.label; f.allow = "fullscreen"; f.allowFullscreen = true;
  $("vFrame").textContent = ""; $("vFrame").appendChild(f);
  $("vOpen").href = "https://issuu.com/" + encodeURIComponent(viewCfg.user) + "/docs/" + encodeURIComponent(doc.d);
}
function buildView(v) {
  viewCfg = v; const tabs = $("vTabs"); tabs.textContent = "";
  v.docs.forEach((doc, i) => {
    const b = el("button", "vtab", doc.label); b.type = "button"; b.setAttribute("role", "tab");
    b.addEventListener("click", () => selectDoc(i)); tabs.appendChild(b);
  });
  selectDoc(0);
}
function stopView() { viewCfg = null; $("vFrame").textContent = ""; $("vTabs").textContent = ""; $("gView").hidden = true; }
window.addEventListener("keydown", e => {
  if (gate.hidden || $("gView").hidden) return;
  if (e.key === "ArrowRight") { selectDoc(viewI + 1); $("vTabs").children[viewI].focus(); }
  else if (e.key === "ArrowLeft") { selectDoc(viewI - 1); $("vTabs").children[viewI].focus(); }
});

/* ---------- Select: dive, then hand off ---------- */
const gate = $("gate");
let timers = [];
function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
function leave(l) {
  $("gLabel").textContent = l.label;
  $("gCoords").textContent = fmt(l.lat, l.lon);
  const link = $("gLink");
  $("gDesc").textContent = l.desc || "";
  const btns = $("gButtons"); btns.textContent = "";
  gate.classList.toggle("viewer", !!l.viewer);
  (l.buttons || []).forEach(b => { const a = el("a", "", b.text + " →"); a.href = b.url; a.target = "_blank"; a.rel = "noopener"; btns.appendChild(a); });
  stopView();
  if (l.feed) {
    link.hidden = true; $("gSoon").hidden = true; $("gFeed").hidden = false;
    startFeed();
  } else if (l.viewer) {
    link.hidden = true; $("gSoon").hidden = true; $("gFeed").hidden = true; stopFeed();
    $("gView").hidden = false; buildView(l.viewer);
  } else {
    $("gFeed").hidden = true; stopFeed();
    if (l.url) { link.href = l.url; link.textContent = "Open " + l.label + " →"; link.hidden = false; $("gSoon").hidden = true; }
    else { link.hidden = true; $("gSoon").hidden = false; }
  }
  hideTip(); hideBio();
  document.body.classList.add("leaving");
  fly(l.lat, l.lon, .8);
  gate.hidden = false;
  later(() => gate.classList.add("on"), reduce ? 0 : 650);
  /* Phones stay on this page so the description can be read. Tap Open to continue. */
  if (l.url && canHover && !l.feed && !l.viewer) later(() => { try { link.click(); } catch (e) {} }, reduce ? 150 : 2600);
  later(() => { (l.viewer ? $("vTabs").querySelector("button") : l.feed ? btns.querySelector("a") : (l.url ? link : $("gBack"))).focus({ preventScroll: true }); }, reduce ? 50 : 1300);
}
function back() {
  timers.forEach(clearTimeout); timers = [];
  gate.classList.remove("on"); gate.hidden = true; stopFeed(); stopView(); gate.classList.remove("viewer"); $("gFeed").hidden = true;
  document.body.classList.remove("leaving");
  setHome();
}
nav.addEventListener("click", e => {
  const a = e.target.closest(".node"); if (!a) return;
  e.preventDefault(); leave(LINKS[a.dataset.i]);
});
$("gBack").addEventListener("click", back);
window.addEventListener("keydown", e => { if (e.key === "Escape" && !gate.hidden) back(); });
</script>
</body>
